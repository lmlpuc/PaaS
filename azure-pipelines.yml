trigger:
- main

pool:
  name: Default # 🔁 Nome do agent pool
  demands:
    - Agent.Name -equals LML001  # 🔁 Força o uso do agente específico - informar o nome do Agente criado
  vmImage: 'windows-latest'

variables:
  resourceGroupName: rg-iac-webapp
  location: centralus
  templateFile: arm-templates/webapp-template.json
  parametersFile: arm-templates/webapp-parameters.json
  webAppBaseName: lmliacpaas  # 🔁 Prefixo do nome do Web App (o pipeline acrescenta um sufixo numérico)

stages:
- stage: DeployInfrastructure
  jobs:
  - job: ARM_Deployment
    steps:
    # Define o nome do Web App no momento da execução:
    # 1) se o Resource Group já tem um Web App com o prefixo, reutiliza (evita criar um app novo a cada execução)
    # 2) senão, sorteia um sufixo e testa na Azure se o nome está livre (nomes de Web App são globais)
    - task: AzureCLI@2
      name: defineName
      displayName: 'Definir nome do Web App'
      inputs:
        azureSubscription: 'SCll01' # 🔁 informar o nome do Service Connection criado
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          $rg   = '$(resourceGroupName)'
          $base = '$(webAppBaseName)'.ToLower()
          $name = $null

          if ((az group exists --name $rg) -eq 'true') {
            $name = az webapp list --resource-group $rg --query "[?starts_with(name, '$base')].name | [0]" -o tsv
          }

          if ($name) {
            Write-Host "Web App já existente no Resource Group $rg - reutilizando: $name"
          } else {
            $subId = az account show --query id -o tsv
            $url = "https://management.azure.com/subscriptions/$subId/providers/Microsoft.Web/checknameavailability?api-version=2022-03-01"
            for ($i = 1; $i -le 10 -and -not $name; $i++) {
              $candidate = '{0}{1:D5}' -f $base, (Get-Random -Minimum 0 -Maximum 100000)
              '{"name":"' + $candidate + '","type":"Microsoft.Web/sites"}' | Out-File -FilePath body.json -Encoding ascii
              $available = az rest --method post --url $url --body '@body.json' --query nameAvailable -o tsv
              if ($available -eq 'true') { $name = $candidate } else { Write-Host "Nome $candidate indisponível, tentando outro..." }
            }
            if (-not $name) { Write-Error 'Não foi possível encontrar um nome livre para o Web App.'; exit 1 }
            Write-Host "Nome livre encontrado: $name"
          }

          # Variável para este job e variável de saída para o estágio DeployApp
          Write-Host "##vso[task.setvariable variable=webAppName]$name"
          Write-Host "##vso[task.setvariable variable=webAppName;isOutput=true]$name"

    - task: AzureResourceManagerTemplateDeployment@3
      inputs:
        deploymentScope: 'Resource Group'
        azureResourceManagerConnection: 'SCll01' # 🔁 informar o nome do Service Connection criado
        subscriptionId: '4246eec3-ab51-462d-9fff-376f19e4e4b1' # 🔁 substituir pelo ID da subscription Azure
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(resourceGroupName)'
        location: '$(location)'
        templateLocation: 'Linked artifact'
        csmFile: '$(templateFile)'
        csmParametersFile: '$(parametersFile)'
        overrideParameters: '-siteName $(webAppName) -location $(location)'
        deploymentMode: 'Incremental'

- stage: DeployApp
  dependsOn: DeployInfrastructure
  jobs:
  - job: Publish_HTML
    variables:
      # Nome definido no estágio anterior
      webAppName: $[ stageDependencies.DeployInfrastructure.ARM_Deployment.outputs['defineName.webAppName'] ]
    steps:
    - task: AzureWebApp@1
      inputs:
        azureSubscription: 'SCll01' # 🔁 informar o nome do Service Connection criado
        appType: 'webAppLinux'
        appName: '$(webAppName)'
        package: 'src'

